<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gia Sư AI" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Gia Sư AI</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { margin: 0; overflow-x: hidden; width: 100%; background: #f0f4f8; display: flex; flex-direction: column; height: 100dvh; color: #1e293b; }
    header { background: #2563eb; color: white; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 8px; }
    header h1 { margin: 0; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; }
    header > * { flex-shrink: 0; }
    #stars { background: rgba(255,255,255,0.2); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 14px; }
    #stars.pop { animation: pop 0.6s; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); background: #fbbf24; } 100% { transform: scale(1); } }
    #btn-new { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; }

    .modes { display: flex; gap: 6px; padding: 8px 10px 4px; background: white; }
    .mode-btn { flex: 1 1 0; min-width: 0; line-height: 1.25; padding: 8px 2px; border: 2px solid #cbd5e1; background: white; border-radius: 10px; font-weight: 600; font-size: 13px; color: #1e293b; }
    .mode-btn.active[data-mode="lop1"] { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
    .mode-btn.active[data-mode="lop4"] { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
    .mode-btn.active[data-mode="phuhuynh"] { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    #chips { display: flex; gap: 6px; padding: 4px 10px 8px; background: white; border-bottom: 1px solid #e2e8f0; overflow-x: auto; scrollbar-width: none; }
    #chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; color: #334155; }

    #chat-box { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: white; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg.err { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
    .msg.star { border-color: #fcd34d; background: #fffbeb; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
    .speak-btn { margin-top: 8px; display: inline-block; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 600; }

    #preview-area { display: none; padding: 8px 14px; background: #e2e8f0; align-items: center; gap: 10px; }
    #preview-img { height: 48px; border-radius: 6px; }

    #rec-bar { display: none; padding: 10px 14px; background: #fee2e2; color: #b91c1c; font-weight: 600; font-size: 15px; align-items: center; gap: 10px; }
    #rec-bar.status { background: #dbeafe; color: #1d4ed8; }
    #rec-level { flex: 1; height: 8px; background: #fecaca; border-radius: 4px; overflow: hidden; }
    #rec-level > div { height: 100%; width: 0; background: #dc2626; transition: width 0.08s; }

    .voice-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; background: #f8fafc; font-size: 14px; border-top: 1px solid #e2e8f0; }
    .controls { background: white; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid #e2e8f0; display: flex; gap: 6px; align-items: center; }
    .icon-btn { width: 48px; height: 48px; border-radius: 50%; border: none; font-size: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #btn-cam { background: #f1f5f9; }
    #btn-mic { background: #ef4444; color: white; }
    #btn-mic.listening { animation: pulse 1.2s infinite; background: #dc2626; }
    #btn-mic.convo { background: #475569; }
    #btn-send { background: #2563eb; color: white; border-radius: 12px; padding: 0 14px; height: 48px; border: none; font-weight: 600; flex-shrink: 0; font-size: 15px; }
    button:disabled { opacity: 0.5; }
    #text-input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 16px; outline: none; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 70% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55); align-items: center; justify-content: center; z-index: 10; padding: 16px; }
    .box { background: white; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); max-height: 90dvh; overflow-y: auto; }
    .box h3 { margin: 0 0 12px; font-size: 17px; }
    .box label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
    .box input, .box select { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; background: white; }
    .box .row { display: flex; gap: 8px; margin-top: 14px; }
    .box .row button { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; }
    .btn-gray { background: #e2e8f0; color: #1e293b; }
    .btn-green { background: #16a34a; color: white; }
    #lock-overlay { background: linear-gradient(160deg, #1e3a8a, #0f766e); z-index: 20; flex-direction: column; color: white; text-align: center; }
    #lock-overlay .big { font-size: 64px; }
    #lock-overlay p { font-size: 20px; line-height: 1.5; margin: 12px 0; }
    #lock-count { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #lock-overlay button { margin-top: 30px; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 10px; padding: 10px 16px; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>🎓 Gia Sư AI</h1>
  <span id="stars">⭐ 0</span>
  <button id="btn-new" onclick="newTopic()">🆕 Bài mới</button>
</header>

<div class="modes">
  <button class="mode-btn active" data-mode="lop1" onclick="switchMode('lop1')">🐥 Lộc<br>Lớp 1</button>
  <button class="mode-btn" data-mode="lop4" onclick="switchMode('lop4')">🚀 Phát<br>Lớp 4</button>
  <button class="mode-btn" data-mode="phuhuynh" onclick="switchMode('phuhuynh')">👨‍👩‍👦<br>Phụ huynh</button>
</div>
<div id="chips"></div>

<div id="chat-box"></div>

<!-- Mật khẩu phụ huynh -->
<div id="pw-overlay" class="overlay">
  <div class="box">
    <h3 id="pw-title"></h3>
    <input id="pw-input" type="password" autocomplete="off" placeholder="Nhập mật khẩu" />
    <div id="pw-msg" style="font-size:13px;color:#b91c1c;min-height:18px;margin:6px 0"></div>
    <div class="row">
      <button id="pw-cancel" class="btn-gray">Hủy</button>
      <button id="pw-ok" class="btn-green">Mở</button>
    </div>
  </div>
</div>

<!-- Cài đặt (phụ huynh) -->
<div id="set-overlay" class="overlay">
  <div class="box">
    <h3>⚙️ Cài đặt</h3>
    <label>Bộ sách của Lộc (lớp 1)</label>
    <select id="set-sachLoc"></select>
    <label>Bộ sách của Phát (lớp 4)</label>
    <select id="set-sachPhat"></select>
    <label>Mỗi lần học tối đa (phút, 0 = không giới hạn)</label>
    <input id="set-phutMoiLan" type="number" inputmode="numeric" min="0" max="180" />
    <label>Nghỉ mắt bao lâu thì được học tiếp (phút)</label>
    <input id="set-phutNghi" type="number" inputmode="numeric" min="1" max="120" />
    <div id="set-msg" style="font-size:13px;min-height:18px;margin-top:8px"></div>
    <div class="row">
      <button class="btn-gray" onclick="closeSettings()">Đóng</button>
      <button class="btn-green" id="set-save" onclick="saveSettings()">Lưu</button>
    </div>
  </div>
</div>

<!-- Nghỉ mắt -->
<div id="lock-overlay" class="overlay">
  <div class="big">😴</div>
  <p id="lock-text">Con học giỏi lắm rồi!<br>Giờ con nghỉ mắt một lát nhé.</p>
  <div id="lock-count">15:00</div>
  <button onclick="parentUnlock()">🔒 Bố mẹ mở khóa</button>
</div>

<div id="preview-area">
  <img id="preview-img" src="" />
  <span style="font-size:14px; flex:1;">Đã chọn ảnh bài tập</span>
  <button onclick="clearImage()" style="border:none; background:#ef4444; color:white; border-radius:6px; padding:6px 12px;">Xóa</button>
</div>

<div id="rec-bar">
  <span id="rec-text">🎙️ Cô đang nghe con…</span>
  <div id="rec-level"><div></div></div>
  <span id="rec-hint" style="font-weight:400;font-size:13px"></span>
</div>

<div class="voice-bar">
  <label><input type="checkbox" id="auto-speak" checked /> Tự động đọc</label>
  <button onclick="stopSpeak()" style="border:none; background:none; color:#ef4444; font-weight:600; font-size:14px;">⏹ Dừng đọc</button>
</div>

<div class="controls">
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)" />
  <button id="btn-cam" class="icon-btn" onclick="document.getElementById('file-input').click()">📷</button>
  <button id="btn-mic" class="icon-btn" onclick="toggleMic()">🎤</button>
  <input type="text" id="text-input" placeholder="Bấm 🎤 để nói, hoặc gõ câu hỏi..." onkeydown="if(event.key==='Enter' && !event.isComposing) sendMessage()" />
  <button id="btn-send" onclick="sendMessage()">Gửi</button>
</div>

<script>

  const BE = { lop1: { ten: 'Lộc', khoa: 'loc' }, lop4: { ten: 'Phát', khoa: 'phat' } };
  const GREETINGS = {
    lop1: "Chào Lộc! Con bấm 🎤 một lần rồi cứ thế nói chuyện với cô nhé, muốn dừng thì bấm 🛑. Con cũng có thể chọn 📖 Luyện đọc, 🔤 Ghép vần hoặc 🧮 Ôn toán ở phía trên.",
    lop4: "Chào Phát! Bấm 🎤 để nói chuyện với cô, chụp 📷 bài tập, hoặc chọn 🧮 Ôn toán, 📚 Ôn tiếng Việt, ✍️ Chấm văn ở phía trên nhé.",
    phuhuynh: "Chế độ Phụ huynh đã bật. Bố mẹ chụp ảnh bài tập hoặc nhập đề để xem đáp án và cách giảng. Bấm ⚙️ Cài đặt để chọn bộ sách và giới hạn thời gian học, 📋 Nhật ký để xem hôm nay các con hỏi gì."
  };
  const CHIPS = {
    lop1: [
      { t: '📖 Luyện đọc', say: 'Cô ơi, con muốn luyện đọc.' },
      { t: '🔤 Ghép vần', say: 'Cô ơi, cho con chơi ghép vần.' },
      { t: '🧮 Ôn toán', say: 'Cô ơi, cho con ôn toán 5 câu nhé.' }
    ],
    lop4: [
      { t: '🧮 Ôn toán', say: 'Cô ơi, cho con ôn toán 5 câu nhé.' },
      { t: '📚 Ôn tiếng Việt', say: 'Cô ơi, cho con ôn tiếng Việt 5 câu nhé.' },
      { t: '✍️ Chấm văn', photo: 'Cô chấm giúp con bài văn này nhé.' }
    ],
    phuhuynh: [
      { t: '⚙️ Cài đặt', fn: () => openSettings() },
      { t: '📋 Nhật ký hôm nay', fn: () => showLog() }
    ]
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let currentMode = 'lop1';
  let imageBase64 = null;
  let history = [];
  let busy = false;
  let parentPw = null;
  let pendingPhotoText = null;
  let limits = store.get('gs_limits', { phutMoiLan: 30, phutNghi: 15 });

  // ================= Gọi API =================
  // Toàn bộ máy chủ chạy trên Cloudflare Worker (Apps Script cũ không dùng nữa)
  const WORKER = 'https://gia-su-ai.giasu-ai.workers.dev';
  async function api(body) {
    const r = await fetch(WORKER, { method: 'POST', body: JSON.stringify(body) }); // text/plain: không cần preflight
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Lỗi không rõ');
    return j;
  }

  // ================= Giao diện chung =================
  function renderChips() {
    const box = document.getElementById('chips');
    box.innerHTML = '';
    CHIPS[currentMode].forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c.t;
      b.onclick = () => chipClick(c);
      box.appendChild(b);
    });
  }

  function renderStars(pop) {
    const el = document.getElementById('stars');
    const be = BE[currentMode];
    el.style.display = be ? '' : 'none';
    if (!be) return;
    el.textContent = '⭐ ' + store.get('gs_sao_' + be.khoa, 0);
    if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }

  function addStar() {
    const be = BE[currentMode]; if (!be) return;
    store.set('gs_sao_' + be.khoa, store.get('gs_sao_' + be.khoa, 0) + 1);
    renderStars(true);
  }

  function cleanMd(t) {
    return t.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s*/gm, '').replace(/^\s*[\*\-]\s+/gm, '• ').replace(/[*_`#]/g, '');
  }

  function addMessage(text, sender, imgSrc = null, showSpeakBtn = false) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    const t = document.createElement('div');
    t.textContent = text;
    div.appendChild(t);
    if (imgSrc) { const img = document.createElement('img'); img.src = imgSrc; div.appendChild(img); }
    if (showSpeakBtn) {
      const btn = document.createElement('button');
      btn.className = 'speak-btn';
      btn.textContent = '🔊 Nghe lại';
      btn.onclick = () => {
        unlockAudio(); cancelListening();
        const m = currentMode;
        speakText(text, true).then(() => continueConversation(m));
      };
      div.appendChild(btn);
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  function setBusy(v) {
    busy = v;
    document.getElementById('btn-send').disabled = v;
    document.getElementById('btn-mic').disabled = v && !convo; // đang trò chuyện vẫn bấm 🛑 được
  }

  // ================= Mật khẩu phụ huynh =================
  function askParentPw(titleText) {
    return new Promise(resolve => {
      const ov = document.getElementById('pw-overlay');
      const inp = document.getElementById('pw-input');
      const msg = document.getElementById('pw-msg');
      const title = document.getElementById('pw-title');
      const ok = document.getElementById('pw-ok'), cancel = document.getElementById('pw-cancel');
      let lanDau = false;
      inp.value = ''; msg.textContent = '';
      title.textContent = titleText || '🔒 Mật khẩu Phụ huynh';
      ov.style.display = 'flex';
      setTimeout(() => inp.focus(), 50);
      const close = v => { ov.style.display = 'none'; ok.onclick = cancel.onclick = inp.onkeydown = null; resolve(v); };
      cancel.onclick = () => close(null);
      inp.onkeydown = e => { if (e.key === 'Enter') ok.click(); };
      ok.onclick = async () => {
        const mk = inp.value;
        if (!mk) return;
        ok.disabled = true; msg.textContent = 'Đang kiểm tra…';
        try {
          if (lanDau) { await api({ action: 'datMK', mk }); close(mk); }
          else {
            const j = await api({ action: 'kiemMK', mk });
            if (j.chuaDat) {
              lanDau = true;
              title.textContent = '🔑 Đặt mật khẩu Phụ huynh (lần đầu)';
              msg.textContent = 'Chưa có mật khẩu. Nhập mật khẩu mới (ít nhất 4 ký tự) rồi bấm Mở để lưu.';
              inp.value = ''; inp.focus();
            } else if (j.dung) close(mk);
            else { msg.textContent = '❌ Sai mật khẩu.'; inp.value = ''; inp.focus(); }
          }
        } catch (e) { msg.textContent = '⚠️ ' + e.message; }
        ok.disabled = false;
      };
    });
  }

  async function switchMode(mode) {
    if (mode === currentMode) return;
    endConversation(); stopSpeak();
    if (mode === 'phuhuynh') {
      const mk = await askParentPw();
      if (!mk) return;
      parentPw = mk;
    } else {
      parentPw = null; // rời chế độ Phụ huynh → khóa lại
      store.set('gs_mode', mode);
    }
    currentMode = mode;
    history = [];
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    renderChips(); renderStars();
    addMessage(GREETINGS[mode], 'ai');
  }

  function newTopic() {
    history = [];
    endConversation(); stopSpeak();
    document.getElementById('chat-box').innerHTML = '';
    addMessage(GREETINGS[currentMode], 'ai');
  }

  // ================= Cài đặt & nhật ký (phụ huynh) =================
  async function openSettings() {
    const ov = document.getElementById('set-overlay');
    const msg = document.getElementById('set-msg');
    msg.textContent = 'Đang tải…'; msg.style.color = '#64748b';
    ov.style.display = 'flex';
    try {
      const j = await api({ action: 'caiDatDayDu', mk: parentPw });
      ['sachLoc', 'sachPhat'].forEach(k => {
        const sel = document.getElementById('set-' + k);
        sel.innerHTML = '<option value="">— Chưa chọn —</option>' + j.boSach.map(s => `<option>${s}</option>`).join('');
        sel.value = j.caiDat[k] || '';
      });
      document.getElementById('set-phutMoiLan').value = j.caiDat.phutMoiLan;
      document.getElementById('set-phutNghi').value = j.caiDat.phutNghi;
      msg.textContent = '';
    } catch (e) { msg.textContent = '⚠️ ' + e.message; msg.style.color = '#b91c1c'; }
  }
  function closeSettings() { document.getElementById('set-overlay').style.display = 'none'; }
  async function saveSettings() {
    const msg = document.getElementById('set-msg'), btn = document.getElementById('set-save');
    btn.disabled = true; msg.textContent = 'Đang lưu…'; msg.style.color = '#64748b';
    try {
      const caiDat = {};
      ['sachLoc', 'sachPhat', 'phutMoiLan', 'phutNghi'].forEach(k => caiDat[k] = document.getElementById('set-' + k).value);
      const j = await api({ action: 'luuCaiDat', mk: parentPw, caiDat });
      limits = { phutMoiLan: j.caiDat.phutMoiLan, phutNghi: j.caiDat.phutNghi };
      store.set('gs_limits', limits);
      msg.textContent = '✅ Đã lưu.'; msg.style.color = '#15803d';
      setTimeout(closeSettings, 700);
    } catch (e) { msg.textContent = '⚠️ ' + e.message; msg.style.color = '#b91c1c'; }
    btn.disabled = false;
  }
  async function showLog() {
    const d = addMessage('Đang tải nhật ký hôm nay…', 'ai');
    try {
      const j = await api({ action: 'nhatKy', mk: parentPw });
      if (!j.ds.length) { d.firstChild.textContent = '📋 Hôm nay các con chưa hỏi cô câu nào.'; return; }
      const dem = {};
      j.ds.forEach(m => dem[m.be] = (dem[m.be] || 0) + 1);
      d.firstChild.textContent = '📋 Nhật ký hôm nay (' + Object.keys(dem).map(k => k + ' ' + dem[k] + ' câu').join(', ') + ')\n\n' +
        j.ds.map(m => `${m.g} · ${m.be}${m.s ? ' ⭐' : ''}\nHỏi: ${m.h || '(ảnh)'}\nCô: ${m.a}`).join('\n\n');
    } catch (e) { d.classList.add('err'); d.firstChild.textContent = '⚠️ ' + e.message; }
  }

  // ================= Giới hạn thời gian học (nghỉ mắt) =================
  function phien() { return store.get('gs_phien', { start: 0, last: 0, lockUntil: 0 }); }
  function isLocked() { return currentMode !== 'phuhuynh' && phien().lockUntil > Date.now(); }
  // Gọi mỗi khi con thao tác; trả false nếu đang phải nghỉ
  function hoatDong() {
    if (currentMode === 'phuhuynh') return true;
    const s = phien(), now = Date.now();
    if (s.lockUntil > now) { showLock(); return false; }
    if (!s.start || now - s.last > limits.phutNghi * 60000) s.start = now; // nghỉ đủ lâu → tính lần mới
    s.last = now;
    store.set('gs_phien', s);
    return true;
  }
  function kiemTraHetGio() {
    if (currentMode === 'phuhuynh') return;
    const s = phien(), now = Date.now();
    if (s.lockUntil > now) { showLock(); return; }
    if (!limits.phutMoiLan || !s.start) return;
    if (now - s.last > limits.phutNghi * 60000) return; // đang không học
    if (now - s.start >= limits.phutMoiLan * 60000) {
      s.lockUntil = now + limits.phutNghi * 60000; s.start = 0;
      store.set('gs_phien', s);
      endConversation(); stopSpeak();
      const be = BE[currentMode];
      speakText((be ? be.ten + ' ơi, ' : '') + 'con học giỏi lắm rồi. Giờ con nghỉ mắt ' + limits.phutNghi + ' phút, đi lại cho khỏe rồi quay lại học tiếp với cô nhé.', true);
      showLock();
    }
  }
  let lockTimer = null;
  function showLock() {
    const ov = document.getElementById('lock-overlay');
    const be = BE[currentMode];
    document.getElementById('lock-text').innerHTML = (be ? be.ten + ' ơi, con' : 'Con') + ' học giỏi lắm rồi!<br>Giờ con nghỉ mắt một lát nhé.';
    ov.style.display = 'flex';
    clearInterval(lockTimer);
    const tick = () => {
      const left = phien().lockUntil - Date.now();
      if (left <= 0) { clearInterval(lockTimer); ov.style.display = 'none'; return; }
      const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
      document.getElementById('lock-count').textContent = m + ':' + String(s).padStart(2, '0');
    };
    tick(); lockTimer = setInterval(tick, 1000);
  }
  async function parentUnlock() {
    const mk = await askParentPw('🔒 Bố mẹ mở khóa cho con học tiếp');
    if (!mk) return;
    store.set('gs_phien', { start: 0, last: 0, lockUntil: 0 });
    clearInterval(lockTimer);
    document.getElementById('lock-overlay').style.display = 'none';
  }
  setInterval(kiemTraHetGio, 20000);

  // ================= Ảnh =================
  function handleImage(e) {
    const file = e.target.files[0];
    if (!file) { pendingPhotoText = null; return; }
    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressed = canvas.toDataURL('image/jpeg', 0.82);
        document.getElementById('preview-img').src = compressed;
        document.getElementById('preview-area').style.display = 'flex';
        imageBase64 = compressed.split(',')[1];
        if (pendingPhotoText) { // nút ✍️ Chấm văn: chụp xong gửi luôn
          document.getElementById('text-input').value = pendingPhotoText;
          pendingPhotoText = null;
          sendMessage();
        }
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function clearImage() {
    imageBase64 = null;
    document.getElementById('file-input').value = '';
    document.getElementById('preview-area').style.display = 'none';
  }

  // ================= Nút luyện tập =================
  async function chipClick(c) {
    if (c.fn) { c.fn(); return; }
    unlockAudio();
    if (busy || !hoatDong()) return;
    if (c.photo) {
      pendingPhotoText = c.photo;
      document.getElementById('file-input').click();
      return;
    }
    // Bật trò chuyện để con trả lời bằng giọng nói luôn
    if (!convo && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try { await ensureMic(); convo = true; updateMicBtn(); } catch (e) {}
    }
    cancelListening();
    document.getElementById('text-input').value = c.say;
    sendMessage();
  }

  // ================= Đọc thành tiếng (giọng Gemini, phát qua <audio>) =================
  // iPhone chỉ cho phát âm thanh nếu thẻ audio đã được "mở" bằng một lần bấm.
  const player = new Audio();
  player.setAttribute('playsinline', '');
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    try { player.src = SILENT; const p = player.play(); if (p) p.catch(() => {}); audioUnlocked = true; } catch (e) {}
    // Mở luôn giọng máy (iPhone chỉ cho đọc nếu lần đầu nằm trong một lần bấm)
    try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  }

  // Gemini hết lượt tạo giọng trong ngày → dùng giọng tiếng Việt của máy tới hết ngày (giữ một giọng suốt ngày)
  const ngayNay = () => new Date().toDateString();
  const dungGiongMay = () => store.get('gs_giong_may', '') === ngayNay();
  function batGiongMay() { store.set('gs_giong_may', ngayNay()); }
  let viVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      viVoice = vs.find(v => /^vi/i.test(v.lang) && /linh|premium|enhanced/i.test(v.name)) || vs.find(v => /^vi/i.test(v.lang)) || null;
    } catch (e) {}
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speakDevice(text, my) {
    return new Promise(res => {
      if (!('speechSynthesis' in window) || my !== speakToken) return res();
      setStatus('🔊 Cô đang nói…');
      const u = new SpeechSynthesisUtterance(text.replace(/•/g, ''));
      u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = 1.0;
      u.onend = res; u.onerror = res;
      speechSynthesis.speak(u);
      const t = setInterval(() => { if (my !== speakToken) { clearInterval(t); res(); } else if (!speechSynthesis.speaking && !speechSynthesis.pending) { clearInterval(t); res(); } }, 300);
    });
  }

  let speakToken = 0;
  function stopSpeak() {
    speakToken++;
    try { player.pause(); } catch (e) {}
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    setStatus('');
  }

  let statusTimer = null;
  function setStatus(t, autoHideMs) {
    const bar = document.getElementById('rec-bar');
    clearTimeout(statusTimer);
    if (!t) { if (!listening) bar.style.display = 'none'; return; }
    if (listening) return;
    bar.style.display = 'flex';
    bar.className = 'status';
    document.getElementById('rec-text').textContent = t;
    document.getElementById('rec-level').style.display = 'none';
    document.getElementById('rec-hint').textContent = '';
    if (autoHideMs) statusTimer = setTimeout(() => setStatus(''), autoHideMs);
  }

  function b64ToBytes(b64) {
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  // Gemini có model trả WAV sẵn, có model trả PCM thô 24 kHz → bọc thành WAV
  function toWavUrl(b64) {
    const pcm = b64ToBytes(b64);
    if (pcm[0] === 0x52 && pcm[1] === 0x49 && pcm[2] === 0x46 && pcm[3] === 0x46) return URL.createObjectURL(new Blob([pcm], { type: 'audio/wav' }));
    const rate = 24000, h = new ArrayBuffer(44), v = new DataView(h);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, pcm.length, true);
    return URL.createObjectURL(new Blob([h, pcm], { type: 'audio/wav' }));
  }

  // Một câu trả lời = một lần tạo giọng (giữ đúng một giọng); chỉ câu rất dài mới chia theo đoạn ≤ 900 ký tự
  function splitChunks(text) {
    text = text.replace(/•/g, '').trim();
    if (text.length <= 900) return [text];
    const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const out = []; let cur = '';
    paras.forEach(p => {
      if (cur && (cur + '\n' + p).length > 900) { out.push(cur); cur = p; } else cur = cur ? cur + '\n' + p : p;
    });
    if (cur) out.push(cur);
    return out;
  }

  function playUrl(url, my) {
    return new Promise(res => {
      if (my !== speakToken) return res();
      setStatus('🔊 Cô đang nói…');
      player.onended = res; player.onerror = res; player.onpause = res;
      player.src = url;
      const p = player.play();
      if (p) p.catch(() => res());
    }).then(() => URL.revokeObjectURL(url));
  }

  // Trả về khi đọc xong (hoặc bị dừng). preB64: âm thanh máy chủ đã tạo sẵn cho cả câu.
  async function speakText(text, force = false, preB64 = null) {
    if (!force && !document.getElementById('auto-speak').checked) return;
    stopSpeak();
    const my = speakToken;
    if (preB64) { await playUrl(toWavUrl(preB64), my); if (my === speakToken) setStatus(''); return; }
    if (dungGiongMay()) { await speakDevice(text, my); if (my === speakToken) setStatus(''); return; }
    const chunks = splitChunks(text);
    const jobs = chunks.map(() => null);
    const load = i => jobs[i] || (jobs[i] = api({ action: 'tts', text: chunks[i] }).then(j => toWavUrl(j.pcm)));
    setStatus('🔊 Cô đang chuẩn bị đọc…');
    for (let i = 0; i < chunks.length; i++) {
      if (my !== speakToken) return;
      let url;
      try { load(i); if (i + 1 < chunks.length) load(i + 1); url = await jobs[i]; }
      catch (e) {
        if (my !== speakToken) return;
        if (/HET_GIONG/.test(e.message)) { batGiongMay(); await speakDevice(chunks.slice(i).join(' '), my); if (my === speakToken) setStatus(''); return; }
        setStatus('⚠️ Chưa đọc được, bấm 🔊 Nghe lại nhé', 4000); return;
      }
      await playUrl(url, my);
    }
    if (my === speakToken) setStatus('');
  }

  // ===== Câu đệm: cô đáp ngay trong lúc nghĩ (tạo sẵn một lần, lưu trên máy) =====
  const FILLERS = ['Ừ, để cô nghĩ một chút nhé.', 'Câu này hay đấy, cô xem nào.', 'Con chờ cô một lát nhé.'];
  const fillerKey = i => 'gs_filler_v3_' + i;
  async function prefetchFillers() {
    try { for (let i = 0; i < 5; i++) localStorage.removeItem('gs_filler_v1_' + i); localStorage.removeItem('gs_filler_v2_' + i); } catch (e) {}
    for (let i = 0; i < FILLERS.length; i++) {
      if (store.get(fillerKey(i), null)) continue;
      try { const j = await api({ action: 'tts', text: FILLERS[i] }); store.set(fillerKey(i), j.pcm); } catch (e) { return; }
    }
  }
  let lastFiller = -1;
  function playFiller() {
    if (dungGiongMay()) { setStatus('🤔 Cô đang suy nghĩ…'); return; } // giọng máy: bỏ câu đệm để khỏi lẫn 2 giọng
    const ready = FILLERS.map((_, i) => i).filter(i => store.get(fillerKey(i), null));
    if (!ready.length) return;
    let i = ready[Math.floor(Math.random() * ready.length)];
    if (i === lastFiller && ready.length > 1) i = ready[(ready.indexOf(i) + 1) % ready.length];
    lastFiller = i;
    stopSpeak();
    const my = speakToken;
    playUrl(toWavUrl(store.get(fillerKey(i))), my).then(() => { if (my === speakToken) setStatus('🤔 Cô đang suy nghĩ…'); });
  }

  // ================= Micro: TRÒ CHUYỆN LIÊN TỤC =================
  // Bấm 🎤 một lần → cô nghe → con im ~1,5 giây là tự gửi → cô trả lời và đọc → cô tự nghe tiếp.
  // Micro mở suốt cuộc trò chuyện (chỉ hỏi quyền một lần), lúc cô đang nói thì bỏ qua tiếng thu được.
  // Bấm 🛑 để dừng; con im lặng 10 giây thì cô tự dừng.
  let mic = null;
  let convo = false;
  let listening = false;
  let rec = null;

  function updateMicBtn() {
    const b = document.getElementById('btn-mic');
    b.classList.toggle('listening', listening);
    b.classList.toggle('convo', convo && !listening);
    b.textContent = convo ? (listening ? '🎤' : '🛑') : '🎤';
  }

  async function ensureMic() {
    if (mic) return;
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    const node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = onAudio;
    src.connect(node); node.connect(ctx.destination);
    mic = { stream, ctx, src, node, rate: ctx.sampleRate };
  }

  function releaseMic() {
    if (!mic) return;
    try { mic.node.disconnect(); mic.src.disconnect(); } catch (e) {}
    mic.stream.getTracks().forEach(t => t.stop());
    try { mic.ctx.close(); } catch (e) {}
    mic = null;
  }

  function onAudio(ev) {
    if (!listening || !rec) return;
    const d = ev.inputBuffer.getChannelData(0);
    rec.chunks.push(new Float32Array(d));
    let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] * d[i];
    const rms = Math.sqrt(s / (d.length / 4));
    document.querySelector('#rec-level > div').style.width = Math.min(100, rms * 600) + '%';
    const now = Date.now();
    if (rms > 0.03) { rec.loudFrames++; if (rec.loudFrames >= 2) rec.heard = true; rec.quietSince = 0; }
    else if (rec.heard) { rec.quietSince = rec.quietSince || now; if (now - rec.quietSince > 1500) stopListening(true); }
    if (listening && now - rec.start > 30000) stopListening(true);
    if (listening && !rec.heard && now - rec.start > 10000) stopListening(false, true);
  }

  function startListening() {
    if (!convo || !mic || busy) return;
    if (isLocked()) { endConversation(); showLock(); return; }
    stopSpeak();
    try { mic.ctx.resume(); } catch (e) {}
    rec = { chunks: [], start: Date.now(), heard: false, quietSince: 0, loudFrames: 0 };
    listening = true;
    const bar = document.getElementById('rec-bar');
    bar.className = '';
    bar.style.display = 'flex';
    document.getElementById('rec-text').textContent = '🎙️ Cô đang nghe con…';
    document.getElementById('rec-level').style.display = '';
    document.getElementById('rec-hint').textContent = 'Nói xong con im một chút';
    updateMicBtn();
  }

  function cancelListening() {
    if (!listening) return;
    listening = false; rec = null;
    document.getElementById('rec-bar').style.display = 'none';
    updateMicBtn();
  }

  function stopListening(send, silent) {
    if (!listening) return;
    listening = false;
    const r = rec; rec = null;
    document.getElementById('rec-bar').style.display = 'none';
    updateMicBtn();
    if (silent) {
      endConversation();
      addMessage("Cô chờ con nhé. Khi nào con muốn hỏi tiếp thì bấm 🎤.", 'ai');
      return;
    }
    if (send && r && r.heard) sendMessage(encodeWav16k(r.chunks, mic ? mic.rate : 48000));
  }

  function endConversation() {
    convo = false;
    cancelListening();
    releaseMic();
    updateMicBtn();
  }

  async function toggleMic() {
    unlockAudio();
    if (convo) {
      if (listening && rec && rec.heard) { stopListening(true); return; }
      endConversation(); stopSpeak(); return;
    }
    if (busy || !hoatDong()) return;
    stopSpeak();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addMessage("Máy này chưa cho dùng Micro trong trình duyệt. Con bấm vào ô nhập chữ rồi dùng nút micro trên bàn phím nhé.", 'ai');
      return;
    }
    try {
      await ensureMic();
      convo = true;
      startListening();
    } catch (e) {
      endConversation();
      addMessage("Chưa mở được Micro. Nếu máy hỏi quyền dùng micro thì con bấm \"Cho phép\" nhé, rồi bấm 🎤 lại.", 'ai').classList.add('err');
    }
  }

  function continueConversation(modeAtSend) {
    if (!convo) return;
    if (modeAtSend !== currentMode) { endConversation(); return; }
    setTimeout(startListening, 350); // chờ dứt tiếng loa để micro khỏi thu tiếng cô
  }

  function encodeWav16k(chunks, inRate) {
    let len = 0; chunks.forEach(c => len += c.length);
    const all = new Float32Array(len); let o = 0;
    chunks.forEach(c => { all.set(c, o); o += c.length; });
    const outRate = 16000, ratio = inRate / outRate, n = Math.floor(all.length / ratio);
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, outRate, true); v.setUint32(28, outRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const a = Math.floor(i * ratio), b = Math.min(all.length, Math.floor((i + 1) * ratio));
      let s = 0; for (let k = a; k < b; k++) s += all[k];
      const x = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
      v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
    }
    const bytes = new Uint8Array(buf); let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  // ================= Gửi câu hỏi =================
  async function sendMessage(audioBase64) {
    if (typeof audioBase64 !== 'string') audioBase64 = null;
    if (busy) return;
    unlockAudio();
    const input = document.getElementById('text-input');
    const text = input.value.trim();
    if (!text && !imageBase64 && !audioBase64) return;
    if (!hoatDong()) { endConversation(); return; }
    if (!audioBase64) cancelListening();
    stopSpeak();

    const previewSrc = imageBase64 ? document.getElementById('preview-img').src : null;
    const sendImg = imageBase64;
    const modeAtSend = currentMode;
    const autoSpeak = document.getElementById('auto-speak').checked;

    const userDiv = addMessage(audioBase64 ? '🎤 …' : (text || "📷 (Đã gửi ảnh bài tập)"), 'user', previewSrc);
    input.value = '';
    clearImage();
    setBusy(true);
    const loadingDiv = addMessage(audioBase64 ? "Cô đang nghe con nói…" : "Cô đang suy nghĩ…", 'ai');
    if (autoSpeak && modeAtSend !== 'phuhuynh') playFiller(); else setStatus('🤔 Cô đang suy nghĩ…');

    try {
      const j = await api({ mode: modeAtSend, text, imageBase64: sendImg, imageMime: 'image/jpeg',
                            audioBase64, audioMime: 'audio/wav', history, docLuon: autoSpeak,
                            mk: modeAtSend === 'phuhuynh' ? parentPw : undefined });
      loadingDiv.remove();
      if (j.hetGiong) batGiongMay();
      if (!j.pcm) setStatus('');
      let userText = text;
      if (audioBase64) {
        userText = (j.cau_hoi || '').trim() + (text ? ' ' + text : '');
        userDiv.firstChild.textContent = '🎤 ' + (userText || '(cô chưa nghe rõ)');
      }
      if (modeAtSend === currentMode) {
        history.push({ role: 'user', text: userText || (sendImg ? '' : '(con nói nhưng cô nghe không rõ)'), imageBase64: sendImg, imageMime: 'image/jpeg' });
        history.push({ role: 'model', text: j.tra_loi });
        let soAnh = 0;
        for (let i = history.length - 1; i >= 0; i--) {
          if (history[i].imageBase64 && ++soAnh > 2) { delete history[i].imageBase64; history[i].text = (history[i].text || '') + ' (ảnh bài tập đã gửi trước đó)'; }
        }
        if (history.length > 12) history = history.slice(-12);
      }
      const clean = cleanMd(j.tra_loi);
      const div = addMessage((j.sao ? '⭐ ' : '') + clean, 'ai', null, true);
      if (j.sao && modeAtSend === currentMode) { div.classList.add('star'); addStar(); }
      setBusy(false);
      await speakText(clean, false, j.pcm || null);
      continueConversation(modeAtSend);
    } catch (err) {
      stopSpeak();
      loadingDiv.classList.add('err');
      loadingDiv.firstChild.textContent = "⚠️ " + (err && err.message ? err.message : err) + (/fetch|network|Load failed/i.test(String(err)) ? ' (mạng yếu? thử lại nhé)' : '');
      setBusy(false);
      continueConversation(modeAtSend);
    }
  }

  // ================= Khởi động =================
  (function init() {
    const m = store.get('gs_mode', 'lop1');
    if (m === 'lop4') {
      currentMode = 'lop4';
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'lop4'));
    }
    renderChips(); renderStars();
    addMessage(GREETINGS[currentMode], 'ai');
    if (isLocked()) showLock();
    setTimeout(prefetchFillers, 1500);
    api({ action: 'layCaiDat' }).then(j => { limits = { phutMoiLan: j.phutMoiLan, phutNghi: j.phutNghi }; store.set('gs_limits', limits); }).catch(() => {});
  })();
</script>
</body>
</html>
